name: Enterprise Graph-RAG CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff, Black, Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src/ tests/ scripts/

      - name: Verify Black Formatting
        run: black --check src/ tests/ scripts/

      - name: Run Mypy Static Type Analysis
        run: mypy src/ tests/

  test-suite:
    name: Unit & Integration Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      APP_ENV: test
      LLM_PROVIDER: mock
      USE_LIGHTWEIGHT_EMBEDDINGS: "true"
      QDRANT_IN_MEMORY: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Pytest Suite with Coverage
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: autonomous-graph-rag-agent:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
