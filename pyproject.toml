[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-graph-rag-agent"
version = "1.0.0"
description = "Production-grade, self-correcting Enterprise Graph-RAG microservice powered by LangGraph, Qdrant, BM25, Cross-Encoder Reranking, and Neo4j."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sawy05" }
]
keywords = ["graph-rag", "langgraph", "qdrant", "neo4j", "bm25", "reranker", "fastapi", "deepeval"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.8.0",
    "neo4j>=5.18.0",
    "sentence-transformers>=2.6.0",
    "langgraph>=0.0.40",
    "langchain-core>=0.1.40",
    "openai>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12",
]
eval = [
    "deepeval>=0.21.0",
    "ragas>=0.1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
